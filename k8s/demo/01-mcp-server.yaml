apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: kagenti-demo
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
      - name: mcp-server
        image: localhost/kagenti/mcp-server:demo
        imagePullPolicy: Never  # Use local image from Kind
        ports:
        - name: http
          containerPort: 8082
          protocol: TCP
        env:
        - name: GITHUB_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mcp-oauth-credentials
              key: client-id
        - name: GITHUB_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mcp-oauth-credentials
              key: client-secret
        args:
        - "http"
        - "--port=8082"
        - "--oauth-client-id=$(GITHUB_OAUTH_CLIENT_ID)"
        - "--oauth-client-secret=$(GITHUB_OAUTH_CLIENT_SECRET)"
        - "--oauth-redirect-uri=http://localhost:8187/callback"
        - "--oauth-scopes=repo,read:org,read:user,user:email"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  namespace: kagenti-demo
  labels:
    app: mcp-server
spec:
  type: NodePort
  ports:
  - name: http
    port: 8184
    targetPort: 8082
    nodePort: 30184
    protocol: TCP
  selector:
    app: mcp-server

